- date: "23 November 2026"
  headline: >-
    🏆 **Best Paper Award at CASAXR 2026!**<br><br>
    We are delighted to announce that **Hamza Noor and Dr. Muhammad Usman** received a Best Paper Award at the **39th International Conference on Computer Animation, Social Agents, and Extended Reality (CASAXR 2026)**, held June 1–3, 2026, in Geneva, Switzerland.<br><br>
    Their award-winning paper, **Realistic Trail Following Behavior in a Dynamically Deformable Terrain Using Terrain-Based Penalty Fields**, explores realistic pedestrian navigation and trail formation on dynamically deformable terrain.<br><br>
    **Congratulations to Hamza Noor, the lead author, on this outstanding achievement!**<br><br>
    [Official award announcement](https://cgs-network.org/CASAXR26/) · [Read the paper](https://doi.org/10.1002/cav.70149)
  image:

- date: "21 August 2025"
  headline: "Our paper has been accepted at EMNLP 2025 in the main track! 🎉🎉🎉 <br><br>The Cardiverse: Harnessing LLMs for Novel Card Game Prototyping, a LLM-based pipeline designed to assist human designers in card game prototyping. Our work integrates game mechanic design, code generation, and gameplay AI creation into a cohesive framework. <br><br>Great collaboration with the [Intelligent Visual Interfaces Lab](https://ivi.cs.rutgers.edu/) at Rutgers! Congratulations to all the co-authors: Danrui Li, Sen Zhang, Samuel S. Sohn, and Mubbasir Kapadia. <br><br>Link of paper: [https://arxiv.org/abs/2502.07128](https://arxiv.org/abs/2502.07128)"
  image: Cardiverse2025.png

- date: "18 August 2025"
  headline: "We are hiring! Our lab is looking for creative, enthusiastic individuals eager to push the boundaries of crowd simulation, virtual reality, and interactive digital environments. We are generally looking for individuals with skillset in tools and platforms like Unreal Engine, Unity3D, VR/AR toolkits, 3D character modeling, motion capture, and other related technologies. If you have the background, we'd love to hear from you!"
  image:

